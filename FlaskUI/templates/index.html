<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-to-Speech Translation</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        @keyframes hoverEffect {
            0% { transform: translate(0, 0); opacity: 1; }
            50% { opacity: 1; transform: translate(100px, -100px); }
            100% { transform: translate(200px, -200px); opacity: 0; }
        }

        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-letter {
            position: absolute;
            font-size: 100px;
            color: rgba(255, 255, 255, 0.8); /* Bright color */
            animation: hoverEffect 5s ease-in-out infinite;
        }

        /* Make the background letters even brighter by adding a glow effect */
        .background-letter {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6), 0 0 30px rgba(255, 255, 255, 0.4);
        }

    </style>
</head>
<body>
    <div class="background-animation">
        <div class="background-letter" style="top: 20%; left: 10%;">ह</div> <!-- Hindi -->
        <div class="background-letter" style="top: 30%; left: 30%;">O</div> <!-- English -->
        <div class="background-letter" style="top: 40%; left: 50%;">Ε</div> <!-- Greek -->
        <div class="background-letter" style="top: 60%; left: 70%;">م</div> <!-- Arabic -->
        <div class="background-letter" style="top: 10%; left: 10%;">अ</div> <!-- Hindi -->
        <div class="background-letter" style="top: 20%; left: 30%;">O</div> <!-- English -->
        <div class="background-letter" style="top: 40%; left: 60%;">न</div> <!-- Hindi -->
        <div class="background-letter" style="top: 50%; left: 80%;">B</div> <!-- English -->
        <div class="background-letter" style="top: 70%; left: 50%;">च</div> <!-- Hindi -->
        <div class="background-letter" style="top: 15%; left: 70%;">अ</div> <!-- Gujarati -->
        <div class="background-letter" style="top: 25%; left: 50%;">స</div> <!-- Telugu -->
        <div class="background-letter" style="top: 60%; left: 30%;">ப</div> <!-- Tamil -->
        <div class="background-letter" style="top: 80%; left: 90%;">శ</div> <!-- Telugu -->
        <div class="background-letter" style="top: 50%; left: 20%;">ଓ</div> <!-- Odia -->
        <div class="background-letter" style="top: 30%; left: 80%;">പ</div> <!-- Malayalam -->
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", function() {
            const letters = document.querySelectorAll('.background-letter');
        
            letters.forEach(letter => {
                let randomDuration = Math.random() * 15 + 25; // Increased the range for slower speed
                let randomScale = Math.random() * 0.3 + 0.7; // Random scale between 0.7 and 1
                let randomRotation = Math.random() * 360; // Random rotation angle
                let randomX = Math.random() * 100; // Random horizontal movement (0 to 100vw)
                let randomY = Math.random() * 100; // Random vertical movement (0 to 100vh)
        
                // Randomize initial position
                letter.style.position = 'absolute';
                letter.style.left = `${randomX}vw`; // Set random left position
                letter.style.top = `${randomY}vh`;  // Set random top position
                
                // Apply random animation properties to each letter
                letter.style.animationDuration = `${randomDuration}s`;
                letter.style.animationTimingFunction = 'ease-in-out';
                letter.style.transform = `translate(${randomX}vw, ${randomY}vh) rotate(${randomRotation}deg) scale(${randomScale})`;
        
                // Add animation class dynamically
                letter.style.animation = `floatLetters ${randomDuration}s infinite ease-in-out`;
            });
        
            let styleSheet = document.styleSheets[0];
            styleSheet.insertRule(`
                @keyframes floatLetters {
                    0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
                    25% { transform: translate(20vw, -30vh) rotate(90deg) scale(1.2); opacity: 0.8; }
                    50% { transform: translate(-40vw, 20vh) rotate(180deg) scale(1); opacity: 0.6; }
                    75% { transform: translate(50vw, -40vh) rotate(270deg) scale(1.1); opacity: 0.7; }
                    100% { transform: translate(0, 0) rotate(360deg) scale(1); opacity: 1; }
                }
            `);
        });
        
    </script>

    <div class="container">
        <h1>Speech-to-Speech Translation</h1>
        <form action="/" method="POST" enctype="multipart/form-data" id="uploadForm">
            <label for="video">Upload Video:</label>
            <input type="file" name="video" id="video" required><br><br>

            <label for="language">Select Language:</label>
            <select name="language" id="language" required>
                <option value="hi">Hindi</option>
                <option value="od">Odia</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="ta">Tamil</option>
                <option value="te">Telugu</option>
                <option value="mr">Marathi</option>
                <option value="kn">Kannada</option>
                <option value="gu">Gujarati</option>
                <option value="pa">Punjabi</option>
            </select><br><br>

            <button type="submit" id="submitBtn">Process Video</button>
        </form>

        <div id="loader" style="display: none;">
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <p id="progress-text">0%</p>
        </div>

        <!-- Result download link -->
        <div id="result" style="display: none;">
            <div class="result">
                <h2>Download Processed Video</h2>
                <a href="" id="downloadLink" class="download-btn" download>Click here to download the translated video</a>
            </div>
        </div>

        <!-- Original and translated video comparison -->
        <div class="video-comparison" style="display: none;">
            <div class="video-container">
                <h3>Original Video</h3>
                <video width="320" height="240" controls>
                    <source id="originalVideoSource" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="video-container">
                <h3>Translated Video</h3>
                <video width="320" height="240" controls>
                    <source id="translatedVideoSource" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
        

        <!-- Speech Animation (visual representation) -->
        <div class="speech-animation" id="speechAnimation" style="display: none;">
            <div class="person">
                <div class="speech-bubble">Hello! How are you?</div>
                <div class="sound-waves"></div>
            </div>
            <div class="person">
                <div class="speech-bubble-translated">Hola! ¿Cómo estás?</div>
                <div class="ear-waves"></div>
            </div>
        </div>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const resultDiv = document.getElementById('result');
        const downloadLink = document.getElementById('downloadLink');
        const videoComparisonDiv = document.querySelector('.video-comparison');
        const originalVideoSource = document.getElementById('originalVideoSource');
        const translatedVideoSource = document.getElementById('translatedVideoSource');
        const speechAnimationDiv = document.getElementById('speechAnimation');
        
        uploadForm.onsubmit = (event) => {
            event.preventDefault();  // Prevent default form submission behavior
            submitBtn.disabled = true;
            loader.style.display = "block";
            progressBar.style.width = "0%";
            progressText.innerText = "0%";
            progressBar.parentElement.style.display = "block"; // Show progress bar

            // Submit the form via AJAX to trigger backend processing
            const formData = new FormData(uploadForm);
            fetch("/", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.download_link) {
                    // Show download link and other results
                    resultDiv.style.display = "block";
                    downloadLink.href = data.download_link;
            
                    // Update video comparison section
                    originalVideoSource.src = data.original_video_url;
                    translatedVideoSource.src = data.translated_video_url;
                    
                    // Load the videos properly
                    originalVideoSource.parentElement.load(); // Reload the original video
                    translatedVideoSource.parentElement.load(); // Reload the translated video
            
                    videoComparisonDiv.style.display = "block";  // Show video comparison section
            
                    // Display speech animation
                    speechAnimationDiv.style.display = "block";
            
                    loader.style.display = "none"; // Hide loader when done
                } else {
                    alert("Error: " + data.error);
                    loader.style.display = "none"; // Hide loader in case of error
                }
            })                                    
            
            .catch(error => {
                alert("Error: " + error.message);
                loader.style.display = "none"; // Hide loader in case of error
            });
        };

        function startProcessing() {
            loader.style.display = 'block';  // Show loader
            const eventSource = new EventSource('/process_video');  // Create SSE connection
            
            eventSource.onmessage = function(event) {
                const progress = event.data;
                progressBar.style.width = progress + '%';  // Update progress bar width
                progressText.innerText = progress + '%';  // Update progress text
        
                if (progress == 100) {
                    loader.style.display = 'none';  // Hide loader when complete
                    eventSource.close();  // Close the SSE connection
                }
            };
        
            eventSource.onerror = function(error) {
                console.error('Error with SSE:', error);
                eventSource.close();  // Close the connection in case of error
            };
        }
        
        // Call startProcessing when your process starts (e.g., after clicking a button)
        startProcessing();
        
        // EventSource for progress updates
        const eventSource = new EventSource('/progress');
        eventSource.onmessage = function(event) {
            const progress = event.data;
            progressBar.style.width = progress + '%';
            progressText.innerText = progress + '%';
            
            // Hide loader and stop processing once progress is 100%
            if (progress == 100) {
                loader.style.display = "none"; // Hide loader when processing is complete
                eventSource.close(); // Close the SSE connection
            }
        };
    </script>

</body>
</html>
